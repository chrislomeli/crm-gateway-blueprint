---
# LocalStack Infrastructure Bootstrap Job
# This job sets up LocalStack with SQS queues and Secrets Manager for local development
# Run with: kubectl apply -f scripts/localstack-secrets-bootstrap.yaml

apiVersion: batch/v1
kind: Job
metadata:
  name: localstack-infrastructure-bootstrap
  namespace: data-pipeline
  labels:
    app: localstack-infrastructure-bootstrap
    purpose: local-development
spec:
  template:
    metadata:
      labels:
        app: localstack-secrets-bootstrap
    spec:
      restartPolicy: Never
      containers:
      - name: bootstrap
        image: amazon/aws-cli:latest
        command: ["/bin/sh"]
        args: ["/scripts/bootstrap-localstack.sh"]
        env:
        - name: AWS_ENDPOINT
          value: "http://localstack:4566"
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_ACCESS_KEY_ID
          value: "test"
        - name: AWS_SECRET_ACCESS_KEY
          value: "test"
        volumeMounts:
        - name: bootstrap-script
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: bootstrap-script
        configMap:
          name: localstack-infrastructure-bootstrap-script
          defaultMode: 0755
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-infrastructure-bootstrap-script
  namespace: data-pipeline
  labels:
    app: localstack-infrastructure-bootstrap
    purpose: local-development
data:
  bootstrap-localstack.sh: |
    #!/bin/bash
    set -e

    echo "🚀 Starting LocalStack infrastructure bootstrap for local development..."

    # Configuration
    LOCALSTACK_ENDPOINT=${AWS_ENDPOINT:-"http://localstack:4566"}
    AWS_REGION=${AWS_REGION:-"us-east-1"}

    echo "📍 LocalStack endpoint: $LOCALSTACK_ENDPOINT"
    echo "🌍 AWS region: $AWS_REGION"

    # Wait for LocalStack to be ready
    echo "⏳ Waiting for LocalStack to be ready..."
    until curl -s "$LOCALSTACK_ENDPOINT/_localstack/health" | grep -q '"secretsmanager": "available"'; do
      echo "   Waiting for LocalStack Secrets Manager service..."
      sleep 2
    done

    until curl -s "$LOCALSTACK_ENDPOINT/_localstack/health" | grep -q '"sqs": "available"'; do
      echo "   Waiting for LocalStack SQS service..."
      sleep 2
    done

    echo "✅ LocalStack services are ready!"

    # Create SQS queues
    echo "📦 Creating SQS queues..."

    # Single queue for webhook events
    aws sqs create-queue \
      --endpoint-url "$LOCALSTACK_ENDPOINT" \
      --region "$AWS_REGION" \
      --queue-name "single-queue" \
      --attributes '{"VisibilityTimeoutSeconds":"30","MessageRetentionPeriod":"1209600"}' || echo "⚠️ single-queue already exists"

    # Intent queue for processed events
    aws sqs create-queue \
      --endpoint-url "$LOCALSTACK_ENDPOINT" \
      --region "$AWS_REGION" \
      --queue-name "intent-queue" \
      --attributes '{"VisibilityTimeoutSeconds":"30","MessageRetentionPeriod":"1209600"}' || echo "⚠️ intent-queue already exists"

    # Dead letter queue for failed messages
    aws sqs create-queue \
      --endpoint-url "$LOCALSTACK_ENDPOINT" \
      --region "$AWS_REGION" \
      --queue-name "dead-letter-queue" \
      --attributes '{"VisibilityTimeoutSeconds":"30","MessageRetentionPeriod":"1209600"}' || echo "⚠️ dead-letter-queue already exists"

    echo "✅ SQS queues created successfully!"

    # Production pattern secrets (JSON objects for !ssm<key>[field] pattern)
    echo "📝 Creating production-pattern secrets in Secrets Manager..."

    # Postgres database credentials
    aws secretsmanager create-secret \
      --endpoint-url "$LOCALSTACK_ENDPOINT" \
      --region "$AWS_REGION" \
      --name "postgres" \
      --description "PostgreSQL database credentials for local development" \
      --secret-string '{"host": "127.0.0.1", "port": 5432, "database": "hello_world", "username": "christian", "password": "antigone", "ssl_mode": "disable"}' || echo "⚠️ postgres secret already exists"

    # MySQL database credentials  
    aws secretsmanager create-secret \
      --endpoint-url "$LOCALSTACK_ENDPOINT" \
      --region "$AWS_REGION" \
      --name "mysql" \
      --description "MySQL database credentials for local development" \
      --secret-string '{"host": "mysql-host", "port": 3306, "database": "hello_world", "username": "root", "password": "mysql-password"}' || echo "⚠️ mysql secret already exists"

    # Shared infrastructure configuration
    aws secretsmanager create-secret \
      --endpoint-url "$LOCALSTACK_ENDPOINT" \
      --region "$AWS_REGION" \
      --name "shared-infrastructure" \
      --description "Shared infrastructure configuration for local development" \
      --secret-string '{"aws_region": "us-east-1", "localstack_endpoint": "http://localstack:4566", "log_retention_days": "7", "monitoring_enabled": "true"}' || echo "⚠️ shared-infrastructure secret already exists"

    # Pipeline worker credentials
    aws secretsmanager create-secret \
      --endpoint-url "$LOCALSTACK_ENDPOINT" \
      --region "$AWS_REGION" \
      --name "pipeline-worker-credentials" \
      --description "Pipeline worker configuration for local development" \
      --secret-string '{"worker_timeout": "30", "max_retries": "3", "sqs_region": "us-east-1", "api_key": "dev-api-key-123", "log_level": "debug"}' || echo "⚠️ pipeline-worker-credentials secret already exists"

    # Elasticsearch credentials
    aws secretsmanager create-secret \
      --endpoint-url "$LOCALSTACK_ENDPOINT" \
      --region "$AWS_REGION" \
      --name "elasticsearch-credentials" \
      --description "Elasticsearch configuration for local development" \
      --secret-string '{"host": "elasticsearch", "port": 9200}' || echo "⚠️ elasticsearch-credentials secret already exists"

    # Hello World app credentials
    aws secretsmanager create-secret \
      --endpoint-url "$LOCALSTACK_ENDPOINT" \
      --region "$AWS_REGION" \
      --name "hello-world-credentials" \
      --description "Hello World application secrets for local development" \
      --secret-string '{"jwt_secret": "dev-jwt-secret-key-for-local-testing-only"}' || echo "⚠️ hello-world-credentials secret already exists"

    # Verify secrets were created
    echo "🔍 Verifying created secrets..."
    aws secretsmanager list-secrets \
      --endpoint-url "$LOCALSTACK_ENDPOINT" \
      --region "$AWS_REGION" \
      --query 'SecretList[].Name' \
      --output table || echo "⚠️ Failed to list secrets"

    # Verify SQS queues were created
    echo "🔍 Verifying created SQS queues..."
    aws sqs list-queues \
      --endpoint-url "$LOCALSTACK_ENDPOINT" \
      --region "$AWS_REGION" \
      --output table || echo "⚠️ Failed to list queues"

    echo "🎉 LocalStack infrastructure bootstrap completed successfully!"
    echo "✅ Local development environment ready with:"
    echo "   • Secrets Manager: 6 secrets created"
    echo "   • SQS: 3 queues created (single-queue, intent-queue, dead-letter-queue)"
    echo "   • Ready for K8s service deployment and testing"
