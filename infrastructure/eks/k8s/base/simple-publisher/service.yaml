apiVersion: v1
kind: Service
metadata:
  name: crm-hubspot-webhook-ingress
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: crm-hubspot-webhook-ingress
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: health
