apiVersion: v1
kind: Service
metadata:
  name: crm-hubspot-webhook-processor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crm-hubspot-webhook-processor
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: health
