apiVersion: v1
kind: Service
metadata:
  name: aio-hubspot-signal-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aio-hubspot-signal-service
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: health
