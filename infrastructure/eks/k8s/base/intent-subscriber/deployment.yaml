apiVersion: apps/v1
kind: Deployment
metadata:
  name: aio-hubspot-signal-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aio-hubspot-signal-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aio-hubspot-signal-service
        app.kubernetes.io/version: "1.0.0"
    spec:
      serviceAccountName: aio-hubspot-signal-service-sa
      containers:
      - name: aio-hubspot-signal-service
        image: 282418939575.dkr.ecr.us-west-2.amazonaws.com/aio-hubspot-signal-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
        - name: health
          containerPort: 3001
        env:
        - name: NODE_ENV
          value: "dev"
        - name: AWS_REGION
          value: "us-west-2"
        - name: API_ENDPOINT
          value: "https://api.example.com"
        - name: CDK_GIT_BRANCH
          value: "main"
        - name: CDK_DEPLOY_ENV
          value: "dev"
        - name: CDK_DEPLOY_COLOR
          value: "blue"
        - name: CDK_DEPLOY_ACCOUNT
          value: "282418939575"
        - name: CDK_DEPLOY_REGION
          value: "us-west-2"
        - name: HEALTH_CHECK_MAX_RETRIES
          value: "3"
        - name: HEALTH_CHECK_RETRY_INTERVAL_SECONDS
          value: "30"
        - name: HEALTH_CHECK_FORCE_SHUTDOWN_ENABLED
          value: "false"
        - name: OBSERVABILITY_PROVIDER
          value: "console"
        - name: OBSERVABILITY_TRACING_ENABLED
          value: "true"
        - name: OBSERVABILITY_METRICS_ENABLED
          value: "true"
        volumeMounts:
        - name: shared-config
          mountPath: /config/shared
          readOnly: true
        - name: app-config
          mountPath: /config/app
          readOnly: true
        - name: secrets
          mountPath: /config/secrets
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: health
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /health/ready
            port: health
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        startupProbe:
          httpGet:
            path: /health/startup
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 10
      volumes:
      - name: shared-config
        configMap:
          name: shared-config
      - name: app-config
        configMap:
          name: aio-hubspot-signal-service-config
      - name: secrets
        secret:
          secretName: secrets
