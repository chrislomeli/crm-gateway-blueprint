# HubSpot Publisher specific configuration for local environment
port: 3000
timeout: 30000

webhookValidationEnabled: false  # Disable webhook validation for local testing

retryEnabled: true
maxAttempts: 3
backoffSeconds: 5

connectSeconds: 10
responseSeconds: 30

batchSize: 10
maxConcurrent: 5

logLevel: "debug"  # More verbose logging for local development
logFormat: "json"

metricsEnabled: true
metricsPort: 9090

tracingEnabled: false  # Disable tracing for local development
serviceName: "simple-publisher"
