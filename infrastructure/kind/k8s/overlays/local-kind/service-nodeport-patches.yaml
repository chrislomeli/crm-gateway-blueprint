apiVersion: v1
kind: Service
metadata:
  name: simple-publisher
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  - port: 3001
    targetPort: 3001
    nodePort: 30001
    protocol: TCP
    name: health
