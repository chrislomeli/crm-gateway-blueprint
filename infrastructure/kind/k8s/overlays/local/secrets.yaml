# This is the actual K8s Secret manifest with all secrets in one place
# For local testing only - using local services and LocalStack
apiVersion: v1
kind: Secret
metadata:
  name: secrets
  labels:
    app.kubernetes.io/name: shared-secrets
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # acme main db
  calls-db.yaml: |
    host: mysql
    port: 3306
    user: acme_user
    password: acme_password
    database: calls
  # Alternate db for testing only
  crm-db.yaml: |
    host: postgres
    port: 5432
    database: pipeline
    user: postgres
    password: postgres_password
  # Elasticsearch config for local development
  opensearch.yaml: |
    accessKeyId: test
    accessKeySecret: test
    esHost: http://elasticsearch.default.svc.cluster.local:9200
    esRegion: us-west-2
    tenantIsolationLevel: tenant  # tenant, crm, or none
  # Hubspot config
  hubspot.yaml: |
    hubspotClientId: test-client-id
    hubspotClientSecret: test-client-secret
    hubspotLoginUri: https://app.hubspot.com/oauth/authorize
    hubspotRedirectUri: https://app.acme.com/oauth/hubspot-signup.php
