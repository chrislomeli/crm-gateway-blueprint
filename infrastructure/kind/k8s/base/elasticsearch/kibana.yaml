apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/component: visualization
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
        app.kubernetes.io/component: visualization
    spec:
      containers:
        - name: kibana
          image: opensearchproject/opensearch-dashboards:2.11.0
          ports:
            - containerPort: 5601
              name: http
          env:
            # Connect to OpenSearch
            - name: OPENSEARCH_HOSTS
              value: "http://elasticsearch:9200"
            # Disable security for local development
            - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
              value: "true"
            # Server configuration
            - name: SERVER_NAME
              value: "opensearch-dashboards-acme-local"
            - name: SERVER_HOST
              value: "0.0.0.0"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/component: visualization
spec:
  type: ClusterIP
  ports:
    - port: 5601
      targetPort: 5601
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: kibana
---
# NodePort service for external access during development
apiVersion: v1
kind: Service
metadata:
  name: kibana-nodeport
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/component: visualization
spec:
  type: NodePort
  ports:
    - port: 5601
      targetPort: 5601
      nodePort: 30566
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: kibana
