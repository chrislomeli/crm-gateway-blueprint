apiVersion: v1
kind: Service
metadata:
  name: simple-publisher-nodeport
  labels:
    app: simple-publisher
    component: publisher
    tier: application
    service-type: nodeport
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30567
    protocol: TCP
    name: http
  selector:
    app: simple-publisher
