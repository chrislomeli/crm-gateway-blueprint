
### FILE: k8s/base/simple-publisher/deployment.yaml
```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: simple-publisher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simple-publisher
        app.kubernetes.io/version: "1.0.0"
    spec:
      serviceAccountName: simple-publisher-sa
      containers:
      - name: simple-publisher
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/simple-publisher:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
        - name: health
          containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: AWS_REGION
          value: "${AWS_REGION}"
        - name: PORT
          value: "3000"
        volumeMounts:
        - name: shared-config
          mountPath: /config/shared
          readOnly: true
        - name: app-config
          mountPath: /config/app
          readOnly: true
        - name: secrets
          mountPath: /config/secrets
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: health
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: shared-config
        configMap:
          name: shared-config
      - name: app-config
        configMap:
          name: simple-publisher-config
      - name: secrets
        secret:
          secretName: calls-db-secret
