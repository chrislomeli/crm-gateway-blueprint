# LocalStack Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/component: aws-emulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: localstack
      app.kubernetes.io/component: aws-emulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: localstack
        app.kubernetes.io/component: aws-emulator
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4566
          env:
            - name: SERVICES
              value: "s3,sqs,sns,dynamodb,lambda,apigateway,iam,sts,secretsmanager"
            - name: DEBUG
              value: "1"
            - name: PERSISTENCE
              value: "1"
          volumeMounts:
            - name: localstack-data
              mountPath: /var/lib/localstack
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: localstack-data
          emptyDir: {}

---
# LocalStack Service
apiVersion: v1
kind: Service
metadata:
  name: localstack
  labels:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/component: aws-emulator
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/component: aws-emulator
  ports:
    - port: 4566
      targetPort: 4566
      nodePort: 30568
