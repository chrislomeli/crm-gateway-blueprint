
### FILE: k8s/base/intent-subscriber/deployment.yaml
```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intent-subscriber
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: intent-subscriber
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intent-subscriber
        app.kubernetes.io/version: "1.0.0"
    spec:
      serviceAccountName: intent-subscriber-sa
      containers:
      - name: intent-subscriber
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/intent-subscriber:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: AWS_REGION
          value: "${AWS_REGION}"
        - name: API_ENDPOINT
          value: "https://api.example.com"
        volumeMounts:
        - name: shared-config
          mountPath: /config/shared
          readOnly: true
        - name: app-config
          mountPath: /config/app
          readOnly: true
        - name: secrets
          mountPath: /config/secrets
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: shared-config
        configMap:
          name: shared-config
      - name: app-config
        configMap:
          name: intent-subscriber-config
      - name: secrets
        secret:
          secretName: calls-db-secret
